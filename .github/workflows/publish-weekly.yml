name: Weekly Publish

on:
  schedule:
    # Monday 00:00 UTC = Monday 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      count:
        description: "Posts to publish this run (default = dripRate in site.config.json)"
        required: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Promote next queue batch to published
        run: node scripts/publish.js --count "${{ inputs.count }}"

      - name: Build blog pages, sitemap, RSS
        run: node scripts/build.js

      - name: Commit publish state
        run: |
          git config user.name "onevision-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/guides
          git diff --cached --quiet || git commit -m "publish: weekly batch $(date +%F) [skip ci]"
          git push

      # See deploy.yml for why lftp + ssl:verify-certificate no is used.
      - name: Deploy to Hostinger over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --ignore-time --parallel=4 --exclude-glob .git* \
              ./public_html /domains/onevisionconsulting.us/public_html;
          "

      # The mirror runs without --delete so that anything uploaded by hand in
      # hPanel survives CI. The trade-off: a page removed from the repo keeps
      # serving until it is listed in deploy/stale-paths.txt, which this step
      # applies. Uses a separate lftp session with fail-exit off, so a path that
      # is already gone can never break the deploy.
      - name: Remove retired pages from the server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ ! -s deploy/stale-paths.txt ]; then
            echo "No retired paths listed - nothing to remove."
            exit 0
          fi
          RM=""
          while IFS= read -r line || [ -n "$line" ]; do
            p=$(printf '%s' "$line" | tr -d '\r' | sed 's/#.*//; s/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -z "$p" ] && continue
            case "$p" in
              /*|*..*) echo "::error::Refusing unsafe retired path: $p"; exit 1 ;;
            esac
            echo "removing: $p"
            RM="$RM rm -f \"/domains/onevisionconsulting.us/public_html/$p\";"
          done < deploy/stale-paths.txt
          if [ -z "$RM" ]; then
            echo "No retired paths after parsing - nothing to remove."
            exit 0
          fi
          lftp -c "
            set cmd:fail-exit no;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            $RM
          "
          echo "Retired paths processed."

      # A silent FTPS failure previously went unnoticed for six weeks: the bot
      # kept promoting posts to `published` and pushing, while nothing reached
      # the server. Fail loudly instead by comparing the live sitemap to the
      # one we just built.
      - name: Verify deploy landed on the live site
        run: |
          sleep 10
          built=$(grep -c '<url>' public_html/sitemap.xml || true)
          live=$(curl -sS --max-time 30 "https://onevisionconsulting.us/sitemap.xml?cb=$GITHUB_RUN_ID" | grep -c '<url>' || true)
          echo "sitemap <url> count -- built: $built, live: $live"
          if [ "$built" != "$live" ]; then
            echo "::error::Deploy verification failed: live sitemap has $live URLs, build produced $built. The upload did not land."
            exit 1
          fi
          echo "Deploy verified: $live URLs live."
